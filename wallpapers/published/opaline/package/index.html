<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opaline — Pastel Nebula</title>
<style>
*{box-sizing:border-box}
/* Average colour of nebula.jpg; the canvas fades in over it once the first frame is drawn. If WebGL fails, wallpaper.js shows the still art here. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b3afc1 center/cover no-repeat}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;opacity:0;transition:opacity .6s}canvas.on{opacity:1}
#error{position:fixed;bottom:12px;right:12px;background:#243044dd;color:#fff;padding:12px;font:13px system-ui;max-width:360px}[hidden]{display:none!important}
</style></head><body>
<canvas id="nebula" aria-label="Slowly drifting pastel nebula"></canvas>
<div id="error" role="status" hidden></div><script src="wallpaper.js"></script></body></html>
